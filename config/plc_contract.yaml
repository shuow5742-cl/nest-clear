registers:
- name: status
  address: 40901
  type: UINT16
  direction: PLC→PC
  description: 设备状态字
- name: task_id
  address: 40903
  type: UINT16
  direction: PLC→PC
  description: 任务编号
- name: request_func
  address: 40904
  type: UINT16
  direction: PLC→PC
  description: 请求功能码
- name: plc_tool_id
  address: 40905
  type: UINT16
  direction: PLC→PC
  description: 90–131 中 1 为工具偏移标定、2 为换针对刀。150–156 中为工具号 1 或 2
- name: actual_x
  address: 40911
  type: REAL32
  direction: PLC→PC
  description: 实时坐标X
- name: actual_y
  address: 40913
  type: REAL32
  direction: PLC→PC
  description: 实时坐标Y
- name: actual_z
  address: 40915
  type: REAL32
  direction: PLC→PC
  description: 实时坐标Z
- name: calibration1_feedback_x
  address: 40917
  type: REAL32
  direction: PLC→PC
  description: 一号工具标定完成时 PLC 写入的最终坐标X
- name: calibration1_feedback_y
  address: 40919
  type: REAL32
  direction: PLC→PC
  description: 一号工具标定完成时 PLC 写入的最终坐标Y
- name: calibration1_feedback_z
  address: 40921
  type: REAL32
  direction: PLC→PC
  description: 一号工具标定完成时 PLC 写入的最终坐标Z
- name: calibration2_feedback_x
  address: 40923
  type: REAL32
  direction: PLC→PC
  description: 二号工具标定完成时 PLC 写入的最终坐标X
- name: calibration2_feedback_y
  address: 40925
  type: REAL32
  direction: PLC→PC
  description: 二号工具标定完成时 PLC 写入的最终坐标Y
- name: calibration2_feedback_z
  address: 40927
  type: REAL32
  direction: PLC→PC
  description: 二号工具标定完成时 PLC 写入的最终坐标Z
- name: heartbeat
  address: 40931
  type: UINT16
  direction: PC→PLC
  description: 心跳，0/1 交替，每秒翻转一次
- name: algorithm_ready
  address: 40932
  type: UINT16
  direction: PC→PLC
  description: 算法启动完成
- name: result_id
  address: 40933
  type: UINT16
  direction: PC→PLC
  description: 应答任务编号，提交信号
- name: reply_func
  address: 40934
  type: UINT16
  direction: PC→PLC
  description: 应答功能码
- name: pc_tool_id
  address: 40935
  type: UINT16
  direction: PC→PLC
  description: 原样回显本次工具相关请求的 40905，包括失败应答
- name: removable_count
  address: 40941
  type: UINT16
  direction: PC→PLC
  description: 本视野可去异物数
- name: scan_x
  address: 40942
  type: REAL32
  direction: PC→PLC
  description: 扫描及标定时的相机移动目标坐标X
- name: scan_y
  address: 40944
  type: REAL32
  direction: PC→PLC
  description: 扫描及标定时的相机移动目标坐标Y
- name: scan_z
  address: 40946
  type: REAL32
  direction: PC→PLC
  description: 扫描及标定时的相机移动目标坐标Z
- name: calibration1_x
  address: 40948
  type: REAL32
  direction: PC→PLC
  description: 一号工具标定移动目标坐标X
- name: calibration1_y
  address: 40950
  type: REAL32

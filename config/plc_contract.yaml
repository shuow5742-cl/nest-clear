  description: 一号工具标定移动目标坐标Z
- name: calibration2_x
  address: 40954
  type: REAL32
  direction: PC→PLC
  description: 二号工具标定移动目标坐标X
- name: calibration2_y
  address: 40956
  type: REAL32
  direction: PC→PLC
  description: 二号工具标定移动目标坐标Y
- name: calibration2_z
  address: 40958
  type: REAL32
  direction: PC→PLC
  description: 二号工具标定移动目标坐标Z
- name: pick1_x
  address: 40960
  type: REAL32
  direction: PC→PLC
  description: 一号工具生产挑取坐标X
- name: pick1_y
  address: 40962
  type: REAL32
  direction: PC→PLC
  description: 一号工具生产挑取坐标Y
- name: pick1_z
  address: 40964
  type: REAL32
  direction: PC→PLC
  description: 一号工具生产挑取坐标Z
- name: pick2_x
  address: 40966
  type: REAL32
  direction: PC→PLC
  description: 二号工具生产挑取坐标X

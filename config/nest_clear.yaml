plc:  # PLC 网络参数，现场调试时与设备网络设置核对
  ip: 192.168.10.10  # PLC 的 IP 地址，按 PLC 实际配置填写
  local_ip: 192.168.10.101  # 工控机 IP，仅记录用，不绑定网络接口
  port: 502  # Modbus TCP 端口，按 PLC 实际配置填写
  timeout_s: 3.0  # 单次连接及读写超时，单位秒，按网络响应情况调整
scan:  # 模组坐标系下的扫描范围与步距，单位 mm
  corners:  # 三个 XY 角点，按现场测量结果填写；Z 在下方单独填写
    - [100.0, 0.0]  # 起点：X 最大、Y 最小，首行从此处沿 Y 正方向扫描
    - [0.0, 0.0]  # X 方向终点：与起点同 Y，确定换行沿 X 负方向的范围
    - [100.0, 100.0]  # Y 方向终点：与起点同 X，确定行内沿 Y 正方向的范围
  step_x: 10.0  # X 轴换行步距，单位 mm，取正数并按视野重叠确定
  step_y: 10.0  # Y 轴行内步距，单位 mm，取正数并按视野重叠确定
  z: 0.0  # 扫描拍照高度，单位 mm，按现场模组坐标填写
arrival_tolerance_mm: 0.1  # 各轴实时位置与下发扫描位置允许的最大绝对差，单位 mm
pick_depth_z: 0.0  # 下针深度的模组 Z 坐标，单位 mm，按现场测量填写
tools:  # 工具补偿，单位 mm：pick_xy = 目标xy + 工具xy，pick_z = pick_depth_z + 工具z（见 design.md §8），标定完成前手工填写
  tool1: [0.0, 0.0, 0.0]  # 一号工具 XYZ 补偿，单位 mm
  tool2: [0.0, 0.0, 0.0]  # 二号工具 XYZ 补偿，单位 mm
travel:  # 模组各轴允许的最小和最大坐标，单位 mm，按设备行程填写
  x: [-500.0, 500.0]  # X 轴最小、最大坐标，单位 mm
  y: [-500.0, 500.0]  # Y 轴最小、最大坐标，单位 mm
  z: [-500.0, 500.0]  # Z 轴最小、最大坐标，单位 mm
camera:  # 相机识别参数
  sn: "待填写"  # 相机序列号占位，现场替换为设备 SN
record:  # 运行记录参数
  directory: runs  # 记录根目录，可填写相对路径或绝对路径

supervisor:  # 父程序轮询和主程序活性监控
  poll_s: 0.1  # 设备状态轮询周期，秒
  watchdog_s: 6.0  # 活性文件超时，秒
  startup_grace_s: 60.0  # 启动后等待首个活性点的最长时间，秒，留出设备预检时间
  child_command: [python, -m, nest_clear.main]  # 主程序命令及参数
vision:  # 首期使用固定像素占位检测器，真实算法采图后替换
  camera_backend: daheng  # mock 用于仿真；daheng 按 camera.sn 打开
  calibration: calibration/camera.yaml  # 相对本配置文件所在目录
  pixels: []  # 固定 [u, v, score]；空列表表示无目标
  dedup_radius_mm: 1.0
  max_targets: 10

ui_preview:
  interval_s: 0.15
  width: 960
  jpeg_quality: 75
  analysis_interval_s: 1.0
ui:  # 本地只读显示界面
  enabled: true
  fullscreen: false
  refresh_ms: 150
  python: /usr/bin/python3  # 带 Xft 的系统 Tk

plc:  # PLC 网络参数，现场调试时与设备网络设置核对
  ip: 192.168.10.10  # PLC 的 IP 地址，按 PLC 实际配置填写
  local_ip: 192.168.10.101  # 工控机 IP，仅记录用，不绑定网络接口
  port: 502  # Modbus TCP 端口，按 PLC 实际配置填写
  timeout_s: 3.0  # 单次连接及读写超时，单位秒，按网络响应情况调整
scan:  # 模组坐标系下的扫描范围与步距，单位 mm
  mode: corners  # tray 按料盘覆盖区规划；corners 使用原有角点路径
  tray:  # 料盘覆盖区从指定角沿方向延伸
    origin_xy: [0.0, 0.0]  # 占位角点，现场测量后填写模组 XY
    size_mm: [182.7, 171.8]  # 一代中心范围 168.45×161.16 加视野 14.25×10.69，约为此尺寸
    x_direction: -1  # 换行沿 X 负方向；1 为正方向
    y_direction: 1  # 首行沿 Y 正方向；-1 为负方向
  fov_mm: null  # 视野宽高，null 时由像素尺度和 4024×3036 推算
  min_overlap_mm: 20.0  # 最小重叠须 ≥ 最长目标毛长度 + 余量，保证至少一图完整出现
  corners:  # 三个 XY 角点，按现场测量结果填写；Z 在下方单独填写
    - [160.0, 0.0]  # 起点：X 最大、Y 最小，首行从此处沿 Y 正方向扫描
    - [100.0, 0.0]  # X 方向终点：与起点同 Y，确定换行沿 X 负方向的范围
    - [160.0, 140.0]  # Y 方向终点：与起点同 X，确定行内沿 Y 正方向的范围
  step_x: 60.0  # X 轴换行步距，单位 mm，取正数并按视野重叠确定
  step_y: 70.0  # Y 轴行内步距，单位 mm，取正数并按视野重叠确定
  z: 0.0  # 扫描拍照高度，单位 mm，按现场模组坐标填写
arrival_tolerance_mm: 0.1  # 各轴实时位置与下发扫描位置允许的最大绝对差，单位 mm
pick_depth_z: 0.0  # 下针深度的模组 Z 坐标，单位 mm，按现场测量填写
travel:  # 模组各轴允许的最小和最大坐标，单位 mm，按设备行程填写
  x: [80.0, 180.0]  # X 轴最小、最大坐标，单位 mm
  y: [-10.0, 150.0]  # Y 轴最小、最大坐标，单位 mm
  z: [-15.0, 0.0]  # Z 轴最小、最大坐标，单位 mm
camera:  # 相机识别参数
  sn: auto  # 恰好一台相机时自动选择
  image_size: [4024, 3036]  # 主相机输出宽、高（像素）
  exposure_us: 6000.0
  gain_db: 0.0
  balance_ratio: [2.4219, 1.0, 1.5078]
record:  # 运行记录参数
  directory: runs  # 记录根目录，可填写相对路径或绝对路径
  image_enabled: true  # 是否保存扫描图像
  image_format: png  # png 或 jpg
  image_quality: 3  # PNG 压缩级别 0–9；JPEG 质量 0–100
  image_queue_size: 32  # 后台最多容纳的图片张数（含正在写入），满时丢弃并记录
  image_retention_days: 30  # 图片保留天数，日志与事件不删除

supervisor:  # 父程序轮询和主程序活性监控
  poll_s: 0.1  # 设备状态轮询周期，秒
  watchdog_s: 6.0  # 活性文件超时，秒
  startup_grace_s: 60.0  # 启动后等待首个活性点的最长时间，秒，留出设备预检时间
  child_command: [.venv/bin/python, -m, nest_clear.main, --config, config/nest_clear.yaml]  # 主程序命令及参数
vision:
  max_fine_targets: 10  # 每轮粗拍选出的精定位目标数
  fine_box_half_mm: 4.0  # 精定位框半宽，mm
  cap_ratio: 1.2  # 首次可去数量对应的尝试次数比例
  tool_check_min_attempts: 3  # 换工具判定所需最少尝试次数
  tool_check_ratio: 0.5  # 剩余目标与首次可去数量的比例阈值
  max_coarse_shots_per_view: 30  # 单视野粗拍防循环上限
  scale_z_bin_mm: 0.1  # 拍照高度按此间隔分档，避免坐标抖动反复计算
  responsibility_zone: true  # 按离扎点最近的视野中心分配；false 恢复原行为
  pick_region_mm: null  # 模组 XY 可挑矩形，例如 {x: [0, 100], y: [0, 80]}；null 不限制
  ignore_regions_px: []  # 像素矩形 [x1,y1,x2,y2]，现场按针尖实际位置填写
  detector: hair  # 检测器：hair 为生产默认值，stub 用于仿真
  allow_placeholder_calibration: false  # 默认禁止占位相机标定下发坐标；仿真可设 true
  # 一代 40 / 80 像素 × 6.959 µm，分别约为 0.3 / 0.6 mm
  review_radius_mm: 0.3  # 挑后复核身份半径，mm；约等于一代 40 像素
  skip_radius_mm: 0.6  # 已尝试目标跳过半径，mm；约等于一代 80 像素
  max_picks_per_view: 30  # 单扫描位最多挑取次数，默认 30 次防死循环
  preview: {window: false}  # 本地 OpenCV 预览窗口，默认关闭
  camera_backend: daheng  # mock 用于仿真；daheng 按 camera.sn 打开
  calibration: calibration/camera.yaml  # 相对本配置文件所在目录
  pixels: []  # 固定 [u, v, score]；空列表表示无目标
  dedup_radius_mm: 1.0
  max_targets: 10
  hair_detector:  # 毛检测参数；像素项填写一代参考像素，会按尺度 k 自动换算
    expected_um_per_px: 26.2  # 11-23 用户定：先放宽跑通全流程，后续收紧；原值 23.6
    scale_tolerance: 0.1  # 11-23 用户定：先放宽跑通全流程，后续收紧；原值 0.05
    reference_um_per_px: 6.959  # 一代参考尺度，µm/像素
    pick_point:  # 一代粗度和中心评分参数
      mode: thick_central  # 取点模式
      thick_pow: 1.0  # 粗度权重指数
      central_pow: 2.0  # 中心权重指数
      dens_pow: 0.0  # 密度权重指数；零时不计算密度高斯
    hair_dark_max: 55  # 一代暗核灰度上限
    dark_open_k: 5  # 一代暗核开运算核尺寸，参考像素
    dark_close_k: 21  # 一代暗核闭运算核尺寸，参考像素
    covered_dilate_k: 15  # 一代去重覆盖膨胀核尺寸，参考像素
    line_blur_sigma: 15  # 一代背景高斯标准差，参考像素
    line_contrast: 13  # 一代细线局部灰度差下限
    line_min_area: 150  # 一代细线面积下限，参考像素平方
    fiber_min_area: 1500  # 一代纤维团面积下限，参考像素平方
    fiber_dens_win_ds: 15  # 一代半分辨率纤维密度窗口，参考像素
    fiber_close_k_ds: 11  # 一代半分辨率纤维闭运算核，参考像素
    bridge_max_hop: 170  # 一代桥接最大距离，参考像素
    line_min_span: 120.0  # 一代线拟合最小跨度，参考像素
    merge_gap_px: 30  # 一代团块合并距离，参考像素
    contain_overlap: 0.8  # 一代包含抑制比例
    seed_grow_max_area: 220000  # 一代种子生长面积上限，参考像素平方
    trace_step: 6.0  # 一代轴追踪步距，参考像素
    pick_dens_sigma: 10.0  # 一代取点密度标准差，参考像素
    min_length_mm: 2.0  # 物理挑取长度门，毫米
    min_area_mm2: 1.2  # 物理挑取面积门，平方毫米
    min_width_mm: 0.35  # 物理等效宽度门，毫米
    max_gray_ratio: 0.70  # 暗度相对背景上限，零表示关闭
    min_dark_frac: 0.15  # 暗像素占比下限，零表示关闭

tool_calibration:  # 双相机对刀配置；目录保存当前补偿及两把工具的基准
  unreliable_action: fail
  click_timeout_s: 120
  enabled: true  # 相机按需打开，未接时对刀请求回 131
  directory: config/calibration  # 基准和补偿文件目录
  cameras:  # 正面看 X/Z，侧面看 Y/Z
    front: {backend: uvc, device: 0}  # 正面设备
    side: {backend: uvc, device: 1}  # 侧面设备
  detection:  # 剪影极值方向、灰度阈值与最小面积
    front:
      direction: [0, 1]
      threshold: 127
      min_area: 5
      probe_offset_px: 7  # 像素，距针尖回退测量宽度的位置
      max_edge_width_px: 10.0  # 11-23 用户定：先放宽跑通全流程，后续收紧；原值 6.0
    side:
      direction: [0, 1]
      threshold: 127
      min_area: 5
      probe_offset_px: 7  # 像素，距针尖回退测量宽度的位置
      max_edge_width_px: 10.0  # 11-23 用户定：先放宽跑通全流程，后续收紧；原值 6.0
  position_tolerance_mm: 0.1  # 11-23 用户定：先放宽跑通全流程，后续收紧；原值 0.05
  tip_tolerance_mm: 0.1  # 11-23 用户定：先放宽跑通全流程，后续收紧；原值 0.03
  consistency_tolerance_mm: 0.05  # 11-23 用户定：先放宽跑通全流程，后续收紧；原值 0.01
  max_iterations: 10  # 最大偏移次数
  probe_step_mm: 0.2  # 首次测量雅可比的步长
  max_step_mm: 0.5  # 每步任一轴上限
  max_total_mm: 2.0  # 相对 P0 任一轴上限
  max_residual_mm: 0.1  # 11-23 用户定：先放宽跑通全流程，后续收紧；原值 0.03
  max_condition: 300.0  # 11-23 用户定：先放宽跑通全流程，后续收紧；原值 100.0
  z_disagreement_mm: 0.1  # 11-23 用户定：先放宽跑通全流程，后续收紧；原值 0.03

# 主相机标定，未列出的字段使用 CameraCalibConfig 缺省值
camera_calibration:
  solve_timeout_s: 60.0  # 异步采样或求解超过此时限回 82
  start_xyz: [92.651, 88.445, -3.0]  # 11-22 夜 用户定：工作距离 100mm 处 Z=-3（真实板 3.15mm 在位）；标定 Z 层 ±3/±1.5 → -6..0，上限恰为行程 Z 最大值 0
  cols: 21
  rows: 16
  square_mm: 5.0
  marker_mm: 3.75
  dictionary: DICT_5X5_250
  board_thickness_mm: 3.15  # 真实标定板实测厚度（11-22）
  xy_limit_mm: 12.5
  z_limit_mm: 3.0
  grid_half_mm: 12.0
  z_outer_mm: 3.0
  z_inner_mm: 1.5
  position_tolerance_mm: 0.1  # 11-23 用户定：先放宽跑通全流程，后续收紧；原值 0.05
  min_corner_ratio: 0.4  # 11-23 用户定：先放宽跑通全流程，后续收紧；原值 0.6
  saturation_level: 250
  max_saturated_fraction: 0.02
  glare_corner_margin_px: null  # null 自动取相邻角点间距的 1/4；整数为像素距离
  glare_blob_min_px: 2000
  max_rms_px: 2.0  # 11-23 用户定：先放宽跑通全流程，后续收紧；原值 0.25
  max_image_rms_px: 3.0  # 11-23 用户定：先放宽跑通全流程，后续收紧；原值 0.5
  module_repeatability_mm: 0.05  # 11-23 用户定：先放宽跑通全流程，后续收紧；原值 0.02
  repeat_drift_margin_mm: 0.01  # 漂移及检测噪声余量
  # max_repeat_px 为旧配置兼容字段，不再参与判定
  max_axis_scale_error: 0.01  # 11-23 用户定：先放宽跑通全流程，后续收紧；原值 0.002
  min_coverage: 0.7  # 11-23 用户定：先放宽跑通全流程，后续收紧；原值 0.9

# 工具偏移标定
tool_offset:
  center_tol_mm: 1.0
  outlier_mm: 0.3  # 11-23 用户定：先放宽跑通全流程，后续收紧；原值 0.1
  min_points: 5
  max_points: 12
  se_tol_mm: 0.08  # 11-23 用户定：先放宽跑通全流程，后续收紧；原值 0.02
  edge_warn_mm: 0.15  # 11-23 用户定：先放宽跑通全流程，后续收紧；原值 0.05
  card_thickness_mm: 0.10
  ring_cross_tol_mm: 0.2  # 11-23 用户定：先放宽跑通全流程，后续收紧；原值 0.08
  settle_window_s: 0.5
  settle_samples: 6
  jitter_tol_mm: 0.06  # 11-23 用户定：先放宽跑通全流程，后续收紧；原值 0.02
  point_order: [T02, T05, T26, T29, T12, T19, T03, T28, T10, T21]
  edge_targets: [T12]

pick_accuracy:
  center_tol_mm: 0.5
  infield_warn_mm: 0.15  # 11-23 用户定：先放宽跑通全流程，后续收紧；原值 0.05
  const_max_dev_mm: 0.2  # 11-23 用户定：先放宽跑通全流程，后续收紧；原值 0.05
  const_std_mm: 0.1  # 11-23 用户定：先放宽跑通全流程，后续收紧；原值 0.025
  repeat_tol_mm: 0.1  # 11-23 用户定：先放宽跑通全流程，后续收紧；原值 0.03
  verify_tol_mm: 0.2  # 11-23 用户定：先放宽跑通全流程，后续收紧；原值 0.05
  outlier_mm: 0.3  # 11-23 用户定：先放宽跑通全流程，后续收紧；原值 0.1
  max_points: 40
  calib_tool_z_mm: -10.0

# 主流程菲林测试：列出的目标不下发挑取坐标。
test_mode:
  non_pickable: [T03, T06, T09, T12, T15, T18, T21, T24, T27, T30]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nest_clear"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "autoweaver",
    "pymodbus>=3.11",
    "pyyaml",
    "numpy",
    "scipy>=1.11",
    "pillow",
    "opencv-python==4.11.0.86",
    "scikit-image>=0.26.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.uv.sources]
autoweaver = { path = "../Auto_Weaver", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
